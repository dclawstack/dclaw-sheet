name: CI

on:
  push:
    branches: [main, "rebuild/**"]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude*.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        timeout-minutes: 8

  eval:
    # SQL-generation golden set. The script self-skips (exit 0) when no OpenRouter
    # key is configured, so this job is green until OPENROUTER_API_KEY is set as a repo secret.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: SQL eval (>90% target)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run eval
